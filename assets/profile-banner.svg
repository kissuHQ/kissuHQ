<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PR — From Ideas to Intelligent Systems</title>
  <desc id="desc">A dark blue and violet animated banner with a glowing abstract network.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B1A"/>
      <stop offset="0.48" stop-color="#111B3A"/>
      <stop offset="1" stop-color="#27104B"/>
      <animate attributeName="x1" values="0;180;0" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1200;1020;1200" dur="16s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="30" x2="1060" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.48" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(170 40) rotate(35) scale(420 250)">
      <stop stop-color="#2563EB" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1050 310) rotate(-145) scale(380 250)">
      <stop stop-color="#DB2777" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#DB2777" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" stroke="#A5B4FC" stroke-opacity="0.09"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glowBlue)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glowPink)"/>

  <g opacity="0.55" filter="url(#blur)">
    <circle cx="146" cy="75" r="62" fill="#2563EB"/>
    <circle cx="1030" cy="290" r="72" fill="#DB2777"/>
  </g>

  <g opacity="0.75" stroke="url(#accent)" stroke-width="1.5">
    <path d="M760 72L905 128L1018 68L1115 150L1032 260L884 226L760 288L674 190L760 72Z"/>
    <path d="M760 72L884 226M905 128L1032 260M1018 68L884 226M1115 150L1032 260M674 190L905 128"/>
  </g>

  <g fill="#C4B5FD" filter="url(#softGlow)">
    <circle cx="760" cy="72" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="905" cy="128" r="4"><animate attributeName="opacity" values="1;0.35;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1018" cy="68" r="4"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1115" cy="150" r="4"><animate attributeName="opacity" values="1;0.3;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1032" cy="260" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="884" cy="226" r="4"><animate attributeName="opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="288" r="4"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="674" cy="190" r="4"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>

  <g fill="#FFFFFF">
    <text x="92" y="145" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="2">PR</text>
    <rect x="96" y="168" width="92" height="4" rx="2" fill="url(#accent)"/>
    <text x="94" y="215" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="4">FROM IDEAS TO</text>
    <text x="94" y="250" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="2">INTELLIGENT SYSTEMS</text>
    <text x="96" y="291" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="16">Ideas  •  Learning  •  Building</text>
  </g>

  <rect x="1.5" y="1.5" width="1197" height="357" rx="26.5" stroke="url(#accent)" stroke-opacity="0.45" stroke-width="3"/>
</svg>